name: Instagram veroeffentlichen

on:
  schedule:
    # GitHub verwirft haeufige Zeitplaene, deshalb nur zweimal pro Stunde.
    # Ein Lauf, der zu frueh kommt, wartet bis zur Uhrzeit des naechsten Beitrags.
    - cron: "9,39 * * * *"
  # sofort nach dem Hochladen neuer Beitraege pruefen, nicht erst beim naechsten Zeitplan-Lauf
  push:
    branches: [main]
    paths:
      - "queue/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probelauf - nichts posten"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Faellige Beitraege veroeffentlichen
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: python publish.py ${{ inputs.dry_run && '--dry-run' || (github.event_name == 'schedule' && '--warten 240' || '') }}
      - name: Stand speichern
        if: always()
        run: |
          git config user.name "autopost"
          git config user.email "autopost@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Veroeffentlichungsstand aktualisiert"
            git pull --rebase
            git push
          fi
